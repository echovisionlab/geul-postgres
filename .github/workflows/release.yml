name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: registry.dsub.io
  POSTGRES_IMAGE: registry.dsub.io/echovisionlab/geul-postgres
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    name: Publish Image
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
    steps:
      - name: Validate Release Please outputs
        run: |
          set -euo pipefail
          for var in RELEASE_TAG RELEASE_VERSION RELEASE_SHA; do
            if [ -z "${!var:-}" ]; then
              echo "Release Please did not return ${var}." >&2
              exit 1
            fi
          done
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag format: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [ "${RELEASE_TAG}" != "v${RELEASE_VERSION}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match version ${RELEASE_VERSION}." >&2
            exit 1
          fi
          if ! [[ "${RELEASE_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Unsupported release SHA format: ${RELEASE_SHA}" >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact release checkout
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [ "${checkout_sha}" != "${RELEASE_SHA}" ]; then
            echo "Checked out ${checkout_sha}, expected release SHA ${RELEASE_SHA}." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Validate release provenance manifest
        run: node scripts/ci/generate-release-provenance.mjs --check

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Validate Harbor credentials
        env:
          HARBOR_REGISTRY_USERNAME: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          HARBOR_REGISTRY_PASSWORD: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in HARBOR_REGISTRY_USERNAME HARBOR_REGISTRY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "Missing secret: ${var}" >&2
              exit 1
            fi
          done

      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}

      - name: Build and push release image
        id: published-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./infra/postgres
          file: ./infra/postgres/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.POSTGRES_IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.POSTGRES_IMAGE }}:sha-${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.ref.name=${{ env.RELEASE_TAG }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=geul-postgres
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}

      - name: Verify release and SHA tag digests
        env:
          PUBLISHED_DIGEST: ${{ steps.published-image.outputs.digest }}
        run: |
          set -euo pipefail
          sha_digest="$(docker buildx imagetools inspect "${POSTGRES_IMAGE}:sha-${RELEASE_SHA}" --format '{{.Manifest.Digest}}')"
          tag_digest="$(docker buildx imagetools inspect "${POSTGRES_IMAGE}:${RELEASE_TAG}" --format '{{.Manifest.Digest}}')"
          if ! [[ "${PUBLISHED_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]] ||
             [ "${sha_digest}" != "${PUBLISHED_DIGEST}" ] ||
             [ "${tag_digest}" != "${PUBLISHED_DIGEST}" ]; then
            echo "Release and SHA tags do not identify the published image digest." >&2
            exit 1
          fi

      - name: Resolve published platform child digests
        id: published-platforms
        env:
          PUBLISHED_DIGEST: ${{ steps.published-image.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "${POSTGRES_IMAGE}@${PUBLISHED_DIGEST}" \
            --raw \
            | node scripts/ci/assert-multiarch-image.mjs \
            | tee -a "${GITHUB_OUTPUT}"

      - name: Smoke published amd64 digest image
        env:
          POSTGRES_IMAGE: ${{ env.POSTGRES_IMAGE }}@${{ steps.published-platforms.outputs.amd64_digest }}
          POSTGRES_PLATFORM: linux/amd64
        run: scripts/ci/validate-postgres-assets.sh --smoke-image

      - name: Smoke published arm64 digest image
        env:
          POSTGRES_IMAGE: ${{ env.POSTGRES_IMAGE }}@${{ steps.published-platforms.outputs.arm64_digest }}
          POSTGRES_PLATFORM: linux/arm64
        run: scripts/ci/validate-postgres-assets.sh --smoke-image
