name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Validate release provenance manifest
        run: node scripts/ci/generate-release-provenance.mjs --check

      - name: Check Node.js script syntax
        run: node --check scripts/ci/assert-multiarch-image.mjs

      - name: Check shell syntax
        run: |
          set -euo pipefail
          for file in scripts/ci/validate-postgres-assets.sh infra/postgres/init/01-init-db.sh infra/postgres/init/02-extensions.sh; do
            bash -n "${file}"
          done

      - name: Check workflow YAML syntax
        run: |
          docker run --rm \
            --volume "${PWD}:/workspace:ro" \
            --workdir /workspace \
            ruby:3.4-alpine \
            ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file) }' \
            .github/workflows/ci.yml \
            .github/workflows/release.yml
